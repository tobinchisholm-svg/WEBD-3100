<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>FuelFare Colour System Demo</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="page-shell">
    <h1>FuelFare</h1>
    <section class="card-grid" aria-label="Trip tools">
      <article class="card">
        <h2>Trip Calculator</h2>
        <p>Find out what your trip from point A to point B will cost in gas.</p>
        <div class="card-actions">
          <button class="button" type="button">Calculate Trip</button>
        </div>
      </article>
      <article class="card">
        <h2>Gas Prices</h2>
        <p>Check this week's gas prices for your zone.</p>
        <div class="card-actions">
          <button class="button" type="button">View Prices</button>
        </div>
      </article>
      <article class="card">
        <h2>My Garage</h2>
        <p>Save your vehicles so every trip uses your car's real fuel rating.</p>
        <div class="card-actions">
          <button class="button" type="button">Open Garage</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
