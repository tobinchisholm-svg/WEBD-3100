<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>FuelFare Colour System Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="index.html">FuelFare</a>
    <nav aria-label="Main navigation">
      <a href="#">Trip Calculator</a>
      <a href="#">Gas Prices</a>
      <a href="#">My Garage</a>
    </nav>
  </header>
  <main class="page-shell">
    <h1>FuelFare</h1>
    <section class="card-grid" aria-label="Trip tools">
      <article class="card">
        <h2>Trip Calculator</h2>
        <p>Find out what your trip from point A to point B will cost in gas.</p>
        <div class="card-actions">
          <button class="button" type="button">Calculate Trip</button>
        </div>
      </article>
      <article class="card">
        <h2>Gas Prices</h2>
        <p>Check this week's gas prices for your zone.</p>
        <div class="card-actions">
          <button class="button" type="button">View Prices</button>
        </div>
      </article>
      <article class="card">
        <h2>My Garage</h2>
        <p>Save your vehicles so every trip uses your car's real fuel rating.</p>
        <div class="card-actions">
          <button class="button" type="button">Open Garage</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
